name: Verify circuits

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digital:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Digital v0.31
        run: |
          curl --fail --location --retry 3 \
            https://github.com/hneemann/Digital/releases/download/v0.31/Digital.zip \
            --output "$RUNNER_TEMP/Digital.zip"
          printf '%s  %s\n' \
            '12f014c8b99140554f8f7464ebc771bbe3de6af39c83c20463492bcb892afc69' \
            "$RUNNER_TEMP/Digital.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/Digital.zip" -d "$RUNNER_TEMP/digital"
      - name: Run native simulator checks
        run: python3 scripts/verify.py --jar "$RUNNER_TEMP/digital/Digital/Digital.jar"
